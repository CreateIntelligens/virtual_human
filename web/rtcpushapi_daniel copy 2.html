<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>虛擬人對話平台</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: '微軟正黑體', Arial, sans-serif;
    }

    html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
    }

    .container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
    }
    
    /* 媒體容器 */
    .media-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }
    
    /* 視頻樣式 - PC版特定設計 */
    video {
        position: absolute;
        top: 0;
        left: 0;
        width: auto;
        height: 100vh;
        transform: translate(50%, 10px);
        object-fit: cover;
        background-color: #f0f0f0;
    }

    /* Canvas样式 */
    #outputCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: auto;
        height: 100vh;
        transform: translate(50%, 10px);
        display: none;
    }

    video.hidden {
        opacity: 0;
    }

    /* 按钮组样式 */
    .button-group {
        position: absolute;
        top: 80%;
        left: 40%;
        display: flex;
        gap: 20px;
        z-index: 1000;
    }

    /* 麥克風按鈕 - 移動版位置 */
    .control-button {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background-color: #9b99ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
        border: none;
    }

    .control-button:hover {
        transform: scale(1.05);
    }

    .control-button:active {
        transform: scale(0.95);
    }

    .control-button svg {
        width: 24px;
        height: 24px;
        fill: black;
    }

    .control-button.recording {
        background-color: #e74c3c;
    }

    .button-text {
        font-size: 12px;
        color: black;
        text-align: center;
        margin-top: 5px;
    }

    /* 對話容器 PC版 - 右側聊天區域 */
    .chat-container {
        position: absolute;
        top: 0;
        right: 0;
        width: 50%;
        height: 100%;
        background: url('https://storage.googleapis.com/cdp_materials/tenants/local/2/gSMg2KTGUkQAr4hWmLr5TmbZCaNgK9nda9Kn9JXn.png') no-repeat center center;
        background-size: cover;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
    }
    
    /* 添加左側空白區域 */
    .left-space {
        position: absolute;
        top: 0;
        left: 0;
        width: 25%;
        height: 100%;
        background-color: white;
    }

    /* 訊息樣式 */
    .message {
        max-width: 80%;
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 10px;
        font-size: 16px;
    }

    .ai-message {
        align-self: flex-start;
        background-color: #E3F2FD;
        color: black;
        border: 1px solid #000;
    }

    .user-message {
        align-self: flex-end;
        background-color: #F7F7F7;
        color: black;
        border-radius: 10px;
        border: 1px solid #000;
    }

    .error-message {
        color: #dc3545;
        padding: 10px;
        margin: 10px 0;
        background-color: #f8d7da;
        border-radius: 4px;
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: none;
    }

    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
        z-index: 1000;
    }

    .modal-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        max-width: 90%;
        width: 400px;
        text-align: center;
    }

    .modal-buttons {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 10px;
    }

    /* 響應式設計 - 移動版調整 */
    @media (max-width: 768px) {
        video {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: none;
            top: 0;
            left: 0;
            object-fit: cover;
        }

        #outputCanvas {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: none;
            top: 0;
            left: 0;
        }
        
        .chat-container {
            width: 100%;
            height: 180px;
            background: transparent;
            background-size: cover;
            padding: 10px 15px;
            bottom: 60px;
            top: auto;
            justify-content: flex-start;
            overflow-y: auto;
        }

        .button-group {
            position: fixed;
            top: 40%;
            right: 15px;
            left: auto;
            flex-direction: column;
            gap: 10px;
        }
        
        .control-button {
            width: 50px;
            height: 50px;
        }

        .control-button svg {
            width: 20px;
            height: 20px;
        }

        .button-text {
            font-size: 10px;
        }
        
        .message {
            max-width: 75%;
            margin-bottom: 10px;
            padding: 12px;
        }
        
        .ai-message {
            align-self: flex-start;
            background-color: #e3f2fd;
            color: black;
            border: 1px solid #000;
            border-radius: 10px;
        }
        
        .user-message {
            align-self: flex-end;
            background-color: #F7F7F7;
            color: black;
            border-radius: 10px;
            border: 1px solid #000;
        }
    }   
    </style>
</head>
<body>
    <div class="container">
        <div class="media-container">
            <div class="error-message" id="errorMessage"></div>
            <video id="rtc_media_player" autoplay muted playsinline></video>
            <canvas id="outputCanvas"></canvas>
            
            <div class="chat-container" id="chatContainer">
                <!-- 聊天消息將在這裡顯示 -->
            </div>
            
            <div class="button-group">
                <button class="control-button" id="micButton">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"></path>
                    </svg>
                    <span class="button-text">開始對話</span>
                </button>

                <button class="control-button" id="toggleGreenScreen">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/>
                        <path d="M7 12h2v5H7zm4-3h2v8h-2zm4-3h2v11h-2z"/>
                    </svg>
                    <span class="button-text">綠幕去除</span>
                </button>
            </div>
        </div>
    </div>

    <div id="permissionModal" class="modal">
        <div class="modal-content">
            <h2>麥克風權限請求</h2>
            <p>此應用程式需要使用您的麥克風進行錄音。您是否同意授予麥克風使用權？</p>
            <div class="modal-buttons">
                <button id="allowButton">允許</button>
                <button id="denyButton">拒絕</button>
            </div>
        </div>
    </div>

    <script src="srs.sdk.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    
    <script>
    $(function(){
        let mediaRecorder = null;
        let audioChunks = [];
        let audioStream = null;
        let dialogHistory = [];
        let checkSpeakingInterval;
        let currentDisplayName = '';
        let isRecording = false;
        let isMobile = window.innerWidth <= 768;
        let maxDisplayedMessages = 2;
        let canvas, ctx;
        let isGreenScreenEnabled = false;
        let animationFrameId = null;
        let isProcessing = false;
        
        const chatContainer = document.getElementById('chatContainer');
        const micButton = document.getElementById('micButton');
        const errorMessage = document.getElementById('errorMessage');
        const permissionModal = document.getElementById('permissionModal');
        const allowButton = document.getElementById('allowButton');
        const denyButton = document.getElementById('denyButton');
        const toggleGreenScreen = document.getElementById('toggleGreenScreen');
        
        const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('sessionId') || '0';
        
        window.addEventListener('resize', function() {
            const newIsMobile = window.innerWidth <= 768;
            if (isMobile !== newIsMobile) {
                isMobile = newIsMobile;
                updateMessageDisplay();
                if (canvas) {
                    resizeCanvas();
                }
            }
        });

        function resizeCanvas() {
            const videoElement = document.getElementById('rtc_media_player');
            if (canvas && videoElement) {
                canvas.width = videoElement.videoWidth;
                canvas.height = videoElement.videoHeight;
            }
        }
        
        function initializeGreenScreen(videoElement) {
            canvas = document.getElementById('outputCanvas');
            ctx = canvas.getContext('2d');
            
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;

            if (isGreenScreenEnabled) {
                $('#outputCanvas').show();
                $('#rtc_media_player').addClass('hidden');
                processFrame();
            }
        }

        function processFrame() {
            if (!isGreenScreenEnabled || isProcessing) {
                return;
            }

            isProcessing = true;
            const videoElement = document.getElementById('rtc_media_player');
            
            if (videoElement.paused || videoElement.ended) {
                isProcessing = false;
                return;
            }

            try {
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    
                    if (g > r * 1.5 && g > b * 1.5) {
                        data[i + 3] = 0;
                    }
                }
                
                ctx.putImageData(imageData, 0, 0);
            } catch (error) {
                console.error('Error processing frame:', error);
            }
            
            isProcessing = false;
            
            if (isGreenScreenEnabled) {
                animationFrameId = requestAnimationFrame(processFrame);
            }
        }

        toggleGreenScreen.onclick = function() {
            isGreenScreenEnabled = !isGreenScreenEnabled;
            const videoElement = document.getElementById('rtc_media_player');

            if (isGreenScreenEnabled) {
                $('#outputCanvas').show();
                $('#rtc_media_player').addClass('hidden');
                toggleGreenScreen.style.backgroundColor = '#e74c3c';
                if (!canvas) {
                    initializeGreenScreen(videoElement);
                }
                processFrame();
            } else {
                $('#outputCanvas').hide();
                $('#rtc_media_player').removeClass('hidden');
                toggleGreenScreen.style.backgroundColor = '#9b99ff';
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
            }
        };
        
        function showError(message) {
            if (errorMessage) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 5000);
            } else {
                console.error('錯誤:', message);
            }
        }

        function showPermissionModal() {
            return new Promise((resolve, reject) => {
                permissionModal.style.display = 'block';
                
                allowButton.onclick = async () => {
                    permissionModal.style.display = 'none';
                    resolve(true);
                };
                
                denyButton.onclick = () => {
                    permissionModal.style.display = 'none';
                    resolve(false);
                };
            });
        }

        async function checkAndRequestPermission() {
            try {
                const permissionStatus = await navigator.permissions.query({ name: 'microphone' });
                
                if (permissionStatus.state === 'granted') {
                    return true;
                } else if (permissionStatus.state === 'prompt') {
                    const userAgreed = await showPermissionModal();
                    if (!userAgreed) {
                        showError('對話功能需要麥克風權限才能使用。');
                        return false;
                    }
                    return true;
                } else if (permissionStatus.state === 'denied') {
                    showError('麥克風權限已被封鎖。請在瀏覽器設定中更改權限設定。');
                    return false;
                }
            } catch (err) {
                const userAgreed = await showPermissionModal();
                return userAgreed;
            }
        }
        
        async function requestMicrophoneAccess() {
            try {
                const hasPermission = await checkAndRequestPermission();
                if (!hasPermission) {
                    return;
                }

                audioStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        channelCount: 1,
                        sampleRate: 16000,
                        sampleSize: 16
                    },
                    video: false
                });
                
                function getSupportedMimeType() {
                    const types = [
                        'audio/webm;codecs=opus',
                        'audio/mp4',
                        'audio/mpeg',
                        ''
                    ];
                    
                    for (const type of types) {
                        if (type === '' || MediaRecorder.isTypeSupported(type)) {
                            return type;
                        }
                    }
                    return '';
                }

                const mimeType = getSupportedMimeType();
                const options = {
                    audioBitsPerSecond: 16000
                };
                if (mimeType) {
                    options.mimeType = mimeType;
                }
                mediaRecorder = new MediaRecorder(audioStream, options);
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await transcribeAudio(audioBlob);
                    audioChunks = [];
                };

                startRecording();
                
            } catch (err) {
                console.error('Microphone access error:', err);
                let errorMsg = '無法存取麥克風。';
                
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    errorMsg = '請允許麥克風存取權限。';
                } else if (err.name === 'NotFoundError') {
                    errorMsg = '找不到麥克風裝置。';
                } else if (err.name === 'NotReadableError') {
                    errorMsg = '麥克風可能正被其他應用程式使用。';
                }
                
                showError(errorMsg);
                micButton.classList.remove('recording');
                micButton.querySelector('.button-text').textContent = '開始對話';
                isRecording = false;
            }
        }
        
        function startRecording() {
            audioChunks = [];
            mediaRecorder.start();
            isRecording = true;
            micButton.classList.add('recording');
            micButton.querySelector('.button-text').textContent = '結束對話';
        }
        
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                
                if (audioStream) {
                    audioStream.getTracks().forEach(track => track.stop());
                    audioStream = null;
                }
            }
            
            isRecording = false;
            micButton.classList.remove('recording');
            micButton.querySelector('.button-text').textContent = '開始對話';
        }

        function updateMessageDisplay() {
            chatContainer.innerHTML = '';
            
            if (isMobile) {
                const startIndex = Math.max(0, dialogHistory.length - maxDisplayedMessages);
                for (let i = startIndex; i < dialogHistory.length; i++) {
                    const dialog = dialogHistory[i];
                    
                    const userMessageElement = document.createElement('div');
                    userMessageElement.className = 'message user-message';
                    userMessageElement.textContent = dialog.user;
                    chatContainer.appendChild(userMessageElement);
                    
                    const aiMessageElement = document.createElement('div');
                    aiMessageElement.className = 'message ai-message';
                    aiMessageElement.textContent = dialog.ai;
                    chatContainer.appendChild(aiMessageElement);
                }
            } else {
                for (let i = 0; i < dialogHistory.length; i++) {
                    const dialog = dialogHistory[i];
                    
                    const userMessageElement = document.createElement('div');
                    userMessageElement.className = 'message user-message';
                    userMessageElement.textContent = dialog.user;
                    chatContainer.appendChild(userMessageElement);
                    
                    const aiMessageElement = document.createElement('div');
                    aiMessageElement.className = 'message ai-message';
                    aiMessageElement.textContent = dialog.ai;
                    chatContainer.appendChild(aiMessageElement);
                }
            }
            
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function addDialog(userMessage, aiMessage) {
            const dialogSet = {
                user: userMessage,
                ai: aiMessage
            };
            dialogHistory.push(dialogSet);
            
            updateMessageDisplay();
        }
        
        async function humantalk(message) {
            $('#rtc_media_player').prop('muted', false);
            console.log('Sending: ' + message);
            
            try {
                await fetch('/human', {
                    body: JSON.stringify({
                        text: message,
                        type: 'echo',
                        sessionid: parseInt(sessionId)
                    }),
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    method: 'POST'
                });
            } catch (error) {
                console.error('Error sending message:', error);
                showError('發送訊息失敗');
            }
        }

        async function transcribeAudio(audioBlob) {
            try {
                const formData = new FormData();
                formData.append('audio', audioBlob, 'audio.wav');
                formData.append('sessionid', sessionId);

                const response = await fetch('https://talk-demo.aitago.tw:9880/transcribe', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('轉錄請求失敗');
                }

                const result = await response.json();
                
                addDialog(result.input_text, result.text);
                
                await humantalk(result.text);
                
            } catch (error) {
                console.error('處理錯誤:', error);
                showError('處理失敗: ' + error.message);
            }
        }
        
        micButton.addEventListener('click', function() {
            if (!isRecording) {
                requestMicrophoneAccess();
            } else {
                stopRecording();
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') {
                return;
            }
            
            if (event.code === 'Space') {
                event.preventDefault();
                if (!isRecording) {
                    requestMicrophoneAccess();
                } else {
                    stopRecording();
                }
            }
        });
        
        function startCheckingSpeakingStatus() {
            checkSpeakingInterval = setInterval(async () => {
                try {
                    const response = await fetch('/is_speaking', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            sessionid: parseInt(sessionId)
                        })
                    });
                    const result = await response.json();
                    
                    if (result.data) {
                        micButton.disabled = true;
                        micButton.style.opacity = "0.6";
                    } else {
                        micButton.disabled = false;
                        micButton.style.opacity = "1";
                    }
                } catch (error) {
                    console.error('Error checking speaking status:', error);
                }
            }, 500);
        }
        
        var sdk = null;

        function startPlay() {
            $('#rtc_media_player').show();
            
            if (sdk) {
                sdk.close();
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
            }
            sdk = new SrsRtcWhipWhepAsync();
            
            const videoElement = document.getElementById('rtc_media_player');
            videoElement.srcObject = sdk.stream;

            videoElement.addEventListener('loadedmetadata', () => {
                if (!canvas) {
                    initializeGreenScreen(videoElement);
                }
            });

            videoElement.addEventListener('playing', () => {
                if (isGreenScreenEnabled && !animationFrameId) {
                    processFrame();
                }
            });

            var host = window.location.hostname;
            var streamName = sessionId === '0' ? 'livestream' : `livestream${sessionId}`;
            var url = `https://${host}:1986/rtc/v1/whep/?app=live&stream=${streamName}`;
            
            sdk.play(url).then(function(session) {
                console.log('WebRTC stream connected successfully');
            }).catch(function(reason) {
                sdk.close();
                $('#rtc_media_player').hide();
                console.error('WebRTC stream error:', reason);
                showError('串流連接失敗: ' + reason);
            });
        }
        
        window.onbeforeunload = function() {
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
            }
            if (sdk) {
                sdk.close();
            }
            if (checkSpeakingInterval) {
                clearInterval(checkSpeakingInterval);
            }
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        };
        
        $(document).ready(async function() {
            $('#rtc_media_player').prop('muted', true);
            startCheckingSpeakingStatus();
            startPlay();
        });
    });
    </script>
</body>
</html>
