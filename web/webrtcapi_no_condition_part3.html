<script>
    $(function(){
        function getTimestamp() {
            return `${new Date().toISOString()}.${(performance.now() % 1000).toFixed(3).padStart(3, '0')}`;
        }

        function getSessionId() {
            return parseInt(document.getElementById('sessionid').value);
        }
    
        let mediaRecorder = null;
        let audioChunks = [];
        let audioStream = null;
        let dialogHistory = [];
        let checkSpeakingInterval;
        let currentDisplayName = '';
        let canvas, ctx;
        let isGreenScreenEnabled = false;
        let animationFrameId = null;
        let isProcessing = false;
        let pc = null;
    
        const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
        
        const videoElement = document.getElementById('rtc_media_player');
        const chatHistory = document.getElementById('chatHistory');
        const recordButton = document.getElementById('recordButton');
        const stopButton = document.getElementById('stopButton');
        const errorMessage = document.getElementById('errorMessage');
        const permissionModal = document.getElementById('permissionModal');
        const allowButton = document.getElementById('allowButton');
        const denyButton = document.getElementById('denyButton');
        const transcriptionResult = document.getElementById('transcriptionResult');

        function negotiate() {
            pc.addTransceiver('video', { direction: 'recvonly' });
            pc.addTransceiver('audio', { direction: 'recvonly' });
            return pc.createOffer().then((offer) => {
                return pc.setLocalDescription(offer);
            }).then(() => {
                return new Promise((resolve) => {
                    if (pc.iceGatheringState === 'complete') {
                        resolve();
                    } else {
                        const checkState = () => {
                            if (pc.iceGatheringState === 'complete') {
                                pc.removeEventListener('icegatheringstatechange', checkState);
                                resolve();
                            }
                        };
                        pc.addEventListener('icegatheringstatechange', checkState);
                    }
                });
            }).then(() => {
                var offer = pc.localDescription;
                return fetch('/offer', {
                    body: JSON.stringify({
                        sdp: offer.sdp,
                        type: offer.type
                    }),
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    method: 'POST'
                });
            }).then((response) => {
                return response.json();
            }).then((answer) => {
                document.getElementById('sessionid').value = answer.sessionid;
                document.getElementById('sessionInfo').textContent = `Session ID: ${answer.sessionid}`;
                console.log(`${getTimestamp()} Session ID updated to: ${answer.sessionid}`);
                return pc.setRemoteDescription(answer);
            }).catch((e) => {
                console.error(`${getTimestamp()} WebRTC negotiation error:`, e);
                showError('WebRTC 連接失敗: ' + e);
            });
        }

        function startPlay() {
            if (pc) {
                pc.close();
            }

            var config = {
                sdpSemantics: 'unified-plan',
                iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }]
            };

            pc = new RTCPeerConnection(config);
            console.log(`${getTimestamp()} RTCPeerConnection created with config:`, config);

            pc.addEventListener('track', (evt) => {
                if (evt.track.kind == 'video') {
                    videoElement.srcObject = evt.streams[0];
                    console.log(`${getTimestamp()} Video track received`);
                } else {
                    document.getElementById('audio').srcObject = evt.streams[0];
                    console.log(`${getTimestamp()} Audio track received`);
                }
            });

            negotiate();
        }
    
        function switchToEnglishInput() {
            if (isMac) {
                const notification = document.getElementById('inputMethodNotification');
                notification.style.display = 'block';
                
                try {
                    const script = `
                        tell application "System Events"
                            key code 50 using {control down, command down}
                        end tell
                    `;
                    console.log(`${getTimestamp()} Attempting to switch input method to English`);
                } catch (error) {
                    console.error(`${getTimestamp()} Failed to switch input method:`, error);
                }
            }
        }
    
        if (isMac) {
            switchToEnglishInput();
            document.addEventListener('compositionstart', () => {
                document.getElementById('inputMethodNotification').style.display = 'block';
            });
            document.addEventListener('compositionend', () => {
                setTimeout(() => {
                    document.getElementById('inputMethodNotification').style.display = 'none';
                }, 3000);
            });
        }
    
        function showError(message) {
            if (errorMessage) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 5000);
            }
        }
    
        function startCheckingSpeakingStatus() {
            checkSpeakingInterval = setInterval(async () => {
                try {
                    const response = await fetch('/is_speaking', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            sessionid: getSessionId()
                        })
                    });
                    const result = await response.json();
                    
                    const avatarSelect = document.getElementById('avatarSelect');
                    const voiceSelect = document.getElementById('voiceSelect');
                    avatarSelect.disabled = result.data;
                    voiceSelect.disabled = result.data;
                    
                    if (result.data) {
                        recordButton.disabled = true;
                        recordButton.style.opacity = "0.6";
                    } else {
                        recordButton.disabled = false;
                        recordButton.style.opacity = "1";
                    }
                } catch (error) {
                    console.error(`${getTimestamp()} Error checking speaking status:`, error);
                }
            }, 500);
        }
    
        function showPermissionModal() {
            return new Promise((resolve, reject) => {
                permissionModal.style.display = 'block';
                
                allowButton.onclick = async () => {
                    permissionModal.style.display = 'none';
                    resolve(true);
                };
                
                denyButton.onclick = () => {
                    permissionModal.style.display = 'none';
                    resolve(false);
                };
            });
        }
    
        async function checkAndRequestPermission() {
            try {
                const permissionStatus = await navigator.permissions.query({ name: 'microphone' });
                
                if (permissionStatus.state === 'granted') {
                    return true;
                } else if (permissionStatus.state === 'prompt') {
                    const userAgreed = await showPermissionModal();
                    if (!userAgreed) {
                        showError('對話功能需要麥克風權限才能使用。');
                        return false;
                    }
                    return true;
                } else if (permissionStatus.state === 'denied') {
                    showError('麥克風權限已被封鎖。請在瀏覽器設定中更改權限設定。');
                    return false;
                }
            } catch (err) {
                const userAgreed = await showPermissionModal();
                return userAgreed;
            }
        }
    
        function getSupportedMimeType() {
            const types = [
                'audio/webm;codecs=opus',
                'audio/mp4',
                'audio/mpeg',
                ''
            ];
            
            for (const type of types) {
                if (type === '' || MediaRecorder.isTypeSupported(type)) {
                    console.log(`${getTimestamp()} MediaRecorder supported type: ${type}`);
                    return type;
                }
            }
            console.log(`${getTimestamp()} No supported MediaRecorder type found.`);
            return '';
        }
    
        async function requestMicrophoneAccess() {
            try {
                const hasPermission = await checkAndRequestPermission();
                if (!hasPermission) {
                    return;
                }
    
                audioStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        channelCount: 1,
                        sampleRate: 16000,
                        sampleSize: 16
                    },
                    video: false
                });
    
                const mimeType = getSupportedMimeType();
                const options = {
                    audioBitsPerSecond: 16000
                };
                if (mimeType) {
                    options.mimeType = mimeType;
                }
                mediaRecorder = new MediaRecorder(audioStream, options);
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await transcribeAudio(audioBlob);
                    audioChunks = [];
                };
    
                startRecording();
                
            } catch (err) {
                console.error(`${getTimestamp()} Microphone access error:`, err);
                let errorMsg = '無法存取麥克風。';
                
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    errorMsg = '請允許麥克風存取權限。';
                } else if (err.name === 'NotFoundError') {
                    errorMsg = '找不到麥克風裝置。';
                } else if (err.name === 'NotReadableError') {
                    errorMsg = '麥克風可能正被其他應用程式使用。';
                }
                
                showError(errorMsg);
                recordButton.textContent = '開始對話';
                recordButton.disabled = false;
                stopButton.disabled = true;
            }
        }
        
        function startRecording() {
            audioChunks = [];
            mediaRecorder.start();
            recordButton.textContent = '對話中...';
            recordButton.disabled = true;
            stopButton.disabled = false;
            transcriptionResult.textContent = '';
            console.log(`${getTimestamp()} Recording started`);
        }
        
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                recordButton.textContent = '開始對話';
                recordButton.disabled = false;
                stopButton.disabled = true;
                console.log(`${getTimestamp()} Recording stopped`);
                
                if (audioStream) {
                    audioStream.getTracks().forEach(track => track.stop());
                    audioStream = null;
                }
            }
        }
    
        function updateChatDisplay() {
            chatHistory.innerHTML = '';
            const startIndex = Math.max(0, dialogHistory.length - 4);
            for (let i = startIndex; i < dialogHistory.length; i++) {
                const dialog = dialogHistory[i];
                const dialogElement = document.createElement('div');
                dialogElement.innerHTML = `
                    <div class="chat-message user-message">${dialog.user}</div>
                    <div class="chat-message ai-message">${dialog.ai}</div>
                `;
                chatHistory.appendChild(dialogElement);
            }
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    
        async function humantalk(message) {
            videoElement.muted = false;
            console.log(`${getTimestamp()} Sending to /human api: ${message}`);
            
            try {
                await fetch('/human', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: message,
                        type: 'echo',
                        sessionid: getSessionId()
                    })
                });
            } catch (error) {
                console.error(`${getTimestamp()} Error sending message:`, error);
                showError('發送訊息失敗');
            }
        }
    
        function audioBufferToWav(buffer) {
            const numOfChan = 1;
            const length = buffer.length * 2;
            const bufferOut = new ArrayBuffer(44 + length);
            const view = new DataView(bufferOut);
            
            function writeUTFBytes(view, offset, string) { 
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }
            
            writeUTFBytes(view, 0, 'RIFF');
            view.setUint32(4, 44 + length - 8, true);
            writeUTFBytes(view, 8, 'WAVE');
            writeUTFBytes(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, 16000, true);
            view.setUint32(28, 16000 * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeUTFBytes(view, 36, 'data');
            view.setUint32(40, length, true);
            
            const channelData = buffer.getChannelData(0);
            let offset = 44;
            for (let i = 0; i < channelData.length; i++) {
                const sample = Math.max(-1, Math.min(1, channelData[i]));
                const value = (sample < 0 ? sample * 0x8000 : sample * 0x7FFF);
                view.setInt16(offset, value, true);
                offset += 2;
            }
            
            return bufferOut;
        }
    
        async function transcribeAudio(audioBlob) {
            try {
                const audioContext = new AudioContext({
                    sampleRate: 16000
                });
                const audioData = await audioBlob.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(audioData);
                
                const monoBuffer = audioContext.createBuffer(
                    1,
                    audioBuffer.length,
                    audioBuffer.sampleRate
                );
                const monoData = monoBuffer.getChannelData(0);
                
                if (audioBuffer.numberOfChannels === 2) {
                    const left = audioBuffer.getChannelData(0);
                    const right = audioBuffer.getChannelData(1);
                    for (let i = 0; i < audioBuffer.length; i++) {
                        monoData[i] = (left[i] + right[i]) / 2;
                    }
                } else {
                    const sourceData = audioBuffer.getChannelData(0);
                    monoData.set(sourceData);
                }
                
                const wavBuffer = await audioBufferToWav(monoBuffer);
                const processedBlob = new Blob([wavBuffer], { type: 'audio/wav' });
                
                const formData = new FormData();
                formData.append('audio', processedBlob, 'audio.wav');
                formData.append('sessionid', getSessionId());
    
                const response = await fetch('https://talk-dev.aitago.tw:9880/transcribe2', {
                    method: 'POST',
                    body: formData
                });
    
                if (!response.ok) {
                    throw new Error('轉錄請求失敗');
                }
                
                const result = await response.json();
                console.log(`${getTimestamp()} Google STT result: ${result.input_text}`);
                console.log(`${getTimestamp()} ai answer result: ${result.text}`);
                
                const uniqueId = 'ai-response-' + Date.now();
                
                const dialogContainer = document.createElement('div');
                dialogContainer.className = 'dialog-pair';
                
                const userMessage = document.createElement('div');
                userMessage.innerHTML = `<div class="chat-message user-message">${result.input_text}</div>`;
                dialogContainer.appendChild(userMessage);
                
                const aiMessage = document.createElement('div');
                aiMessage.id = uniqueId;
                aiMessage.innerHTML = `
                    <div class="chat-message ai-message typing-indicator">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                `;
                dialogContainer.appendChild(aiMessage);
                
                chatHistory.appendChild(dialogContainer);
                chatHistory.scrollTop = chatHistory.scrollHeight;
                
                transcriptionResult.innerHTML = '';
                
                const speakingStatusElement = document.createElement('div');
                speakingStatusElement.id = 'speaking-status-indicator';
                speakingStatusElement.setAttribute('data-response-id', uniqueId);
                speakingStatusElement.style.display = 'none';
                document.body.appendChild(speakingStatusElement);
                
                await humantalk(result.text);
                
                const checkIfSpeaking = setInterval(async () => {
                    try {
                        const response = await fetch('/is_speaking', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ sessionid: getSessionId() })
                        });
                        const speakingStatus = await response.json();
                        
                        if (speakingStatus.data === true) {
                            clearInterval(checkIfSpeaking);
                            
                            const tempAiMessage = document.getElementById(uniqueId);
                            if (tempAiMessage) {
                                tempAiMessage.innerHTML = `<div class="chat-message ai-message">${result.text}</div>`;
                            }
                            
                            const dialogSet = {
                                user: result.input_text,
                                ai: result.text
                            };
                            dialogHistory.push(dialogSet);
                            
                            updateChatDisplay();
                            
                            document.body.removeChild(speakingStatusElement);
                        }
                    } catch (error) {
                        console.error(`${getTimestamp()} Error checking speaking status:`, error);
                    }
                }, 200);
                
                setTimeout(() => {
                    if (document.getElementById('speaking-status-indicator')) {
                        clearInterval(checkIfSpeaking);
                        
                        const tempAiMessage = document.getElementById(uniqueId);
                        if (tempAiMessage) {
                            tempAiMessage.innerHTML = `<div class="chat-message ai-message">${result.text}</div>`;
                        }
                        
                        const dialogSet = {
                            user: result.input_text,
                            ai: result.text
                        };
                        dialogHistory.push(dialogSet);
                        
                        updateChatDisplay();
                        
                        document.body.removeChild(speakingStatusElement);
                    }
                }, 5000);
            } catch (error) {
                console.error(`${getTimestamp()} Processing error:`, error);
                showError('處理失敗: ' + error.message);
                transcriptionResult.textContent = '處理失敗';
            }
        }
    
        document.getElementById('voiceSelect').onchange = function() {
            const configType = parseInt(this.value);
            fetch('/switch_tts_endpoint', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    sessionid: getSessionId(),
                    config_type: configType
                })
            });
            console.log(`${getTimestamp()} Voice type changed to ${configType}`);
        };
    
        document.getElementById('avatarSelect').onchange = function() {
            const avatar_id = this.value;
            fetch('/switch_avatar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    sessionid: getSessionId(),
                    avatar_id: avatar_id
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 0) {
                    currentDisplayName = data.display_name;
                }
            })
            .then(() => {
                console.log(`${getTimestamp()} Avatar changed to ${avatar_id}`);
            })
            .catch(error => {
                console.error(`${getTimestamp()} Error switching avatar:`, error);
                showError('切換虛擬人失敗');
            });
        };
    
        async function initializeUIWithConfig() {
            try {
                const configResponse = await fetch('/get_current_config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sessionid: getSessionId()
                    })
                });
                const configData = await configResponse.json();
                
                if (configData.code === 0) {
                    const avatarsResponse = await fetch('/get_avatars');
                    const avatarsData = await avatarsResponse.json();
                    
                    const voicesResponse = await fetch('/get_voices');
                    const voicesData = await voicesResponse.json();
                    
                    if (avatarsData.code === 0 && voicesData.code === 0) {
                        const avatarSelect = document.getElementById('avatarSelect');
                        const voiceSelect = document.getElementById('voiceSelect');
                        
                        avatarSelect.innerHTML = '';
                        Object.values(avatarsData.data).forEach(avatar => {
                            const option = document.createElement('option');
                            option.value = avatar.id;
                            option.textContent = avatar.display_name;
                            avatarSelect.appendChild(option);
                        });
                        
                        voiceSelect.innerHTML = '';
                        Object.values(voicesData.data).forEach(voice => {
                            const option = document.createElement('option');
                            option.value = voice.id;
                            option.textContent = voice.name;
                            voiceSelect.appendChild(option);
                        });
                        
                        avatarSelect.value = configData.data.current_avatar_id;
                        voiceSelect.value = configData.data.current_voice_type.toString();
                    }
                }
                console.log(`${getTimestamp()} UI initialized`);
            } catch (error) {
                console.error(`${getTimestamp()} Error initializing UI:`, error);
                showError('初始化設定失敗');
            }
        }
    
        recordButton.onclick = () => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                requestMicrophoneAccess();
            }
        };
        
        stopButton.onclick = stopRecording;
    
        document.addEventListener('keydown', function(event) {
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') {
                return;
            }
            
            if (event.key.toLowerCase() === 'r') {
                if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                    requestMicrophoneAccess();
                }
            }
            
            if (event.key.toLowerCase() === 't') {
                stopRecording();
            }
    
            if (event.code === 'Space') {
                event.preventDefault();
                if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                    requestMicrophoneAccess();
                } else {
                    stopRecording();
                }
            }
        });
    
        chatHistory.addEventListener('touchstart', function(e) {
            e.stopPropagation();
        }, false);
    
        window.onbeforeunload = function() {
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
            }
            if (pc) {
                pc.close();
            }
            if (checkSpeakingInterval) {
                clearInterval(checkSpeakingInterval);
            }
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        };
        
        $(document).ready(async function() {
            videoElement.muted = true;
            startCheckingSpeakingStatus();
            await initializeUIWithConfig();
            startPlay();
            console.log(`${getTimestamp()} Application initialized`);
        });
    });
</script>
