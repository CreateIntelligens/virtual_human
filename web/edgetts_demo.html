<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdgeTTS 前端示範</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .slider-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .slider-item {
            text-align: center;
        }
        
        .slider-item label {
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }
        
        .slider-value {
            font-size: 14px;
            color: #667eea;
            font-weight: bold;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: #e0e0e0;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .audio-player {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            display: none;
        }
        
        .audio-player.active {
            display: block;
        }
        
        audio {
            width: 100%;
            margin-top: 10px;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        
        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            display: block;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top-color: #0c5460;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ EdgeTTS 語音合成</h1>
        
        <div class="form-group">
            <label for="text">輸入文字:</label>
            <textarea id="text" placeholder="請輸入要轉換成語音的文字...">你好,這是 EdgeTTS 語音合成測試。歡迎使用!</textarea>
        </div>
        
        <div class="form-group">
            <label for="voice">選擇語音:</label>
            <select id="voice">
                <option value="zh-TW-HsiaoChenNeural">曉臻 (女生 - 台灣)</option>
                <option value="zh-TW-YunJheNeural">雲哲 (男生 - 台灣)</option>
                <option value="zh-TW-HsiaoYuNeural">曉雨 (女生 - 台灣)</option>
                <option value="zh-CN-XiaoxiaoNeural">曉曉 (女生 - 中國)</option>
                <option value="zh-CN-YunxiNeural">雲希 (男生 - 中國)</option>
                <option value="en-US-JennyNeural">Jenny (Female - US)</option>
                <option value="en-US-GuyNeural">Guy (Male - US)</option>
                <option value="ja-JP-NanamiNeural">七海 (女性 - 日本)</option>
                <option value="ko-KR-SunHiNeural">善熙 (여성 - 한국)</option>
            </select>
        </div>
        
        <div class="slider-group">
            <div class="slider-item">
                <label>語速</label>
                <input type="range" id="rate" min="-50" max="100" value="0" step="10">
                <div class="slider-value" id="rateValue">+0%</div>
            </div>
            
            <div class="slider-item">
                <label>音量</label>
                <input type="range" id="volume" min="-50" max="100" value="0" step="10">
                <div class="slider-value" id="volumeValue">+0%</div>
            </div>
            
            <div class="slider-item">
                <label>音調</label>
                <input type="range" id="pitch" min="-50" max="50" value="0" step="10">
                <div class="slider-value" id="pitchValue">+0Hz</div>
            </div>
        </div>
        
        <div class="button-group">
            <button class="btn-primary" id="generateBtn">🎵 生成語音</button>
            <button class="btn-secondary" id="downloadBtn" disabled>💾 下載音檔</button>
        </div>
        
        <div class="status" id="status"></div>
        
        <div class="audio-player" id="audioPlayer">
            <h3>🔊 播放音檔:</h3>
            <audio id="audio" controls></audio>
        </div>
    </div>

    <script>
        // API 服務地址 - 請根據實際情況修改
        const API_URL = 'http://localhost:8765';
        
        let currentAudioBlob = null;
        
        // 滑桿更新
        const rateSlider = document.getElementById('rate');
        const volumeSlider = document.getElementById('volume');
        const pitchSlider = document.getElementById('pitch');
        
        rateSlider.addEventListener('input', (e) => {
            const value = e.target.value;
            document.getElementById('rateValue').textContent = `${value >= 0 ? '+' : ''}${value}%`;
        });
        
        volumeSlider.addEventListener('input', (e) => {
            const value = e.target.value;
            document.getElementById('volumeValue').textContent = `${value >= 0 ? '+' : ''}${value}%`;
        });
        
        pitchSlider.addEventListener('input', (e) => {
            const value = e.target.value;
            document.getElementById('pitchValue').textContent = `${value >= 0 ? '+' : ''}${value}Hz`;
        });
        
        // 生成語音
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const text = document.getElementById('text').value.trim();
            
            if (!text) {
                showStatus('請輸入文字!', 'error');
                return;
            }
            
            const voice = document.getElementById('voice').value;
            const rate = `${rateSlider.value >= 0 ? '+' : ''}${rateSlider.value}%`;
            const volume = `${volumeSlider.value >= 0 ? '+' : ''}${volumeSlider.value}%`;
            const pitch = `${pitchSlider.value >= 0 ? '+' : ''}${pitchSlider.value}Hz`;
            
            showStatus('正在生成語音...', 'loading');
            document.getElementById('generateBtn').disabled = true;
            
            try {
                const response = await fetch(`${API_URL}/tts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text,
                        voice: voice,
                        rate: rate,
                        volume: volume,
                        pitch: pitch
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const blob = await response.blob();
                currentAudioBlob = blob;
                
                const audioUrl = URL.createObjectURL(blob);
                const audio = document.getElementById('audio');
                audio.src = audioUrl;
                
                document.getElementById('audioPlayer').classList.add('active');
                document.getElementById('downloadBtn').disabled = false;
                
                showStatus('✅ 語音生成成功!', 'success');
                
                // 自動播放
                audio.play();
                
            } catch (error) {
                console.error('Error:', error);
                showStatus('❌ 生成失敗: ' + error.message, 'error');
            } finally {
                document.getElementById('generateBtn').disabled = false;
            }
        });
        
        // 下載音檔
        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!currentAudioBlob) return;
            
            const url = URL.createObjectURL(currentAudioBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `speech_${Date.now()}.mp3`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showStatus('💾 下載完成!', 'success');
        });
        
        // 顯示狀態訊息
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            
            if (type === 'loading') {
                status.innerHTML = `<span class="loading-spinner"></span> ${message}`;
            } else {
                status.textContent = message;
            }
            
            if (type !== 'loading') {
                setTimeout(() => {
                    status.style.display = 'none';
                }, 5000);
            }
        }
        
        // 頁面載入時測試連接
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${API_URL}/`);
                if (response.ok) {
                    console.log('✅ EdgeTTS API 服務已連接');
                }
            } catch (error) {
                showStatus('⚠️ 無法連接到 API 服務,請確認服務是否已啟動', 'error');
                console.error('API connection error:', error);
            }
        });
    </script>
</body>
</html>
