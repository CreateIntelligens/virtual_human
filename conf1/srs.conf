listen              1935;
max_connections     1000;
daemon              off;
http_server {
    enabled         on;
    listen          1985;
    dir             ./objs/nginx/html;
}

# WebRTC服务配置
rtc_server {
    enabled         on;
    listen          8000;
    # 支持所有编码器
    all_codecs      on;
}

vhost __defaultVhost__ {
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    
    rtc {
        enabled     on;
        # WHIP和WHEP配置
        whip {
            enabled     on;
        }
        whep {
            enabled     on;
        }
        # 启用VP8编码器优先
        preferred_codec VP8;
        # 允许透明通道
        rgba         on;
        # 设置较高质量
        bframe      0;
        # 关闭自动缩放
        scaling     off;
    }
    
    # 直播流设置
    publish {
        # 关闭互相转码，保持原始编码
        transcode   off;
        # 保持较高质量
        mr {
            enabled     off;
        }
    }
}
